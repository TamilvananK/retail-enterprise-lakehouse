version: 2

models:
  - name: dim_customer
    columns:
      - name: customer_sk
        tests:
          - unique
          - not_null
      - name: is_current
        tests:
          - not_null

  - name: dim_product
    columns:
      - name: product_sk
        tests:
          - unique
          - not_null

  - name: fact_sales
    columns:
      - name: transaction_id
        tests:
          - unique
          - not_null
      - name: customer_sk
        tests:
          - not_null
          # Enforce referential integrity: Every sale must map to a valid historical customer state
          - relationships:
              to: ref('dim_customer')
              field: customer_sk
      - name: product_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_sk